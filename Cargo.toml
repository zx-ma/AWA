[workspace]
resolver = "2"
members = [
    "crates/awa-ipc",
    "crates/awa-core",
    "crates/awa-daemon",
    "crates/pam_awa",
    "crates/awa-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# ML / inference
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.17.2"
toml = "0.8"

# Image handling
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "macros",
    "signal",
] }

# CLI
clap = { version = "4", features = ["derive"] }

# Camera (Linux V4L2)
v4l = "0.14"

# PAM module authoring
pamsm = "0.5"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date / time
chrono = { version = "0.4", features = ["serde"] }

# System / libc
libc = "0.2"
